stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: "" # Disable TLS for basic dind setups

services:
  - name: docker:24.0.5-dind
    alias: docker

before_script:
  - until docker info; do sleep 1; done # Wait for dind to initialize

build:
  stage: build
  image:
    name: docker:27
    entrypoint: [""]
  services:
    - docker:27-dind
  before_script:
    - docker build -t ruby27-bookworm .
  script:
    - docker run --rm -v $(pwd):/app ruby27-bookworm bash -c "
      apt-get update -qy &&
      apt-get install -y nodejs npm &&
      npm install npm@latest -g &&
      npm install gulp -g &&
      npm install &&
      bundle install &&
      gulp deploy"
    - docker cp <container_id>:/app/_site ./_site
  artifacts:
    paths:
      - _site
    expire_in: 10 mins
  only:
    - main

deploy:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  dependencies:
    - build
  script:
    - aws s3 sync ./_site/ s3://$S3_BUCKET_NAME --delete
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
  after_script:
    - rm -r _site
  only:
    - main
