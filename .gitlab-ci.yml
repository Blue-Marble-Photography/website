stages:
  - build
  - deploy

build:
  stage: build
  image: ruby:3.4.12-trixie
  variables:
    JEKYLL_ENV: prod
  before_script:
    - bundle install
  script:
    - bundle exec jekyll build
  artifacts:
    paths:
      - _site
    expire_in: 10 mins
  only:
    - main

deploy:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  dependencies:
    - build
  script:
    - aws s3 sync ./_site/ s3://$S3_BUCKET_NAME --delete
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
  after_script:
    - rm -r _site
  only:
    - main
