stages:
  - build
  - deploy

build:
  stage: build
  image: ruby:latest
  before_script:
    - apt-get update -qy
    - apt-get install -y nodejs
    - apt-get install -y npm
    - npm install npm@latest -g
    - npm install gulp -g
    - npm install
    - gem install bundler
    - bundle config set path '/cache'
    - bundle install
  script:
    - gulp deploy
    - JEKYLL_ENV=prod bundle exec jekyll build --destination _site2/
  artifacts:
    paths:
      - _site
      - _site2
    expire_in: 10 mins
  only:
    - master

deploy:
  stage: deploy
  image: python:latest
  dependencies:
    - build
  before_script:
    - pip install awscli
  script:
    - aws s3 sync ./_site/ s3://$S3_BUCKET_NAME --delete
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
  after_script:
    - rm -r _site
  only:
    - master
