<a class="icon-facebook-squared" title="Share on Facebook" aria-label="Share on Facebook"
    href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | prepend: site.url }}#gallery-{{ forloop.index }}"
    target="_blank" rel="noopener"></a>
<a class="icon-forward" title="Share Link" href="#" aria-label="Share Link" data-bs-toggle="modal"
    data-bs-target="#shareModal" data-url="{{ page.url | prepend: site.url }}#gallery-{{ forloop.index }}"
    data-title="{{ image.title }}"></a>

{% if page.allow_download %}
{% if page.allow_download == "watermark" %}
<a class="icon-download" href="{{ image_url | replace: '.jpg' , '-1440.jpg' }}" title="Download Digital File" aria-label="Download Digital File" download></a>
{% else %}
<a class="icon-download" href="{{ image_url | replace: 'photography/' , 'photography/originals/' }}" title="Download Digital File" aria-label="Download Digital File" download></a>
{% endif %}
{% endif %}
