<link rel="dns-prefetch" href="//fonts.gstatic.com">
{% if page.snipcart or layout.snipcart %}<link rel="dns-prefetch" href="//stackpath.bootstrapcdn.com">{% endif %}

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="{% if page.description %}{{ page.description | strip_newlines | strip | truncate: 320 }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | strip | truncate: 320 }}{% else %}{{ site.description }}{% endif %}">
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="{{ site.author.name }}">
{% if page.robots %}<meta name="robots" content="noindex,nofollow,noimageindex,noarchive,nosnippet">{% endif %}

<title>{% if page.title %}{{ page.title | append: ' - ' }}{% endif %}{{ site.title }}</title>

<link rel="apple-touch-icon" sizes="180x180" href="{{ site.asset_url | prepend: site.url }}/favicons/apple-touch-icon.png?v=eE5dlz3jAR">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.asset_url | prepend: site.url }}/favicons/favicon-32x32.png?v=eE5dlz3jAR">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.asset_url | prepend: site.url }}/favicons/favicon-16x16.png?v=eE5dlz3jAR">
<link rel="manifest" href="{{ site.url }}/manifest.json?v=eE5dlz3jAR">
<link rel="shortcut icon" href="{{ site.asset_url | prepend: site.url }}/favicons/favicon.ico?v=eE5dlz3jAR">
<meta name="apple-mobile-web-app-title" content="Blue Marble Photography">
<meta name="application-name" content="Blue Marble Photography">
<meta name="msapplication-TileColor" content="#e3e3e3">
<meta name="msapplication-config" content="{{ site.asset_url | prepend: site.url }}/favicons/browserconfig.xml?v=eE5dlz3jAR">
<meta name="theme-color" content="#146496">

<link rel="canonical" href="{% if page.canonical %}{{ page.canonical }}{% else %}{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}{% endif %}">

<meta name="twitter:card" content="{% if page.feature_image.filename %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:creator" content="{{ site.author.twitter_username }}">
<meta name="twitter:site" content="{{ site.twitter.username }}">

<meta property="og:type" content="article">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_newlines | strip | truncate: 320 }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | strip | truncate: 320 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:image" content="{% if page.featured_image.filename %}{{ page.featured_image.filename | replace: '.jpg', '-1440.jpg' | prepend: site.base_url | prepend: site.featured_image_url | prepend: site.url }}{% else %}{{ site.asset_url | append: '/favicons/logo-512x512.png' | prepend: site.url }}{% endif %}">
<meta property="og:image:width" content="{% if page.featured_image.filename %}1400{% else %}512{% endif %}">
<meta property="og:url" content="{% if page.canonical %}{{ page.canonical }}{% else %}{{ page.url | remove:'index.html' | prepend: site.baseurl | prepend: site.url }}{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">

<meta property="fb:admins" content="{{ site.facebook.admins }}">
<meta property="fb:app_id" content="{{ site.facebook.app_id }}">
<meta property="article:publisher" content="{{ site.facebook.publisher }}">
<meta property="article:author" content="{{ site.author.facebook_id }}">
<meta property="article:published_time" content="{{ page.date }}">

<script type="application/ld+json">
  {% if page.date %}
  {
    "@context": "http://schema.org",
    "@type": "Article",
    "dateCreated": "{{ page.date | date_to_xmlschema }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",
    "headline": "{% if page.title %}{{ page.title }}{% else %}{{ site.headline }}{% endif %}",
    "description": "{% if page.description %}{{ page.description | strip_newlines | strip | truncate: 320 }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | strip | truncate: 320 }}{% else %}{{ site.description }}{% endif %}",
    "image": "{% if page.featured_image.filename %}{{ page.featured_image.filename | replace: '.jpg', '-1440.jpg' | prepend: site.base_url | prepend: site.featured_image_url | prepend: site.url }}{% else %}{{ site.asset_url | append: '/favicons/logo-512x512.png' | prepend: site.url }}{% endif %}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author.name }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.asset_url | append: '/favicons/logo-512x512.png' | prepend: site.url }}"
      }
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{% if page.canonical %}{{ page.canonical }}{% else %}{{ page.url | remove:'index.html' | prepend: site.baseurl | prepend: site.url }}{% endif %}"
    }
  }
  {% else %}
  {
    "@context": "http://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.asset_url | append: '/favicons/logo-512x512.png' | prepend: site.url }}"
    },
    "sameAs": [{% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}]
  }
  {% endif %}
</script>

<script>
  {% include /js/modernizr.js %}
</script>

<style>
  {% include /css/critical.css %}
  {% if page.featured_image.filename %}{% include /css/featured-image.css %}{% endif %}
  {% if page.snipcart or layout.snipcart %}{% include /css/snipcart.css %}{% endif %}
  {% if page.allow_download %}{% include /css/context-menu.css %}{% endif %}
</style>

{% if jekyll.environment == "prod" %}{% include /js/gtag.js %}{% endif %}
