<script async src="https://cdn.snipcart.com/themes/v3.0.26/default/snipcart.js"></script>
<div hidden id="snipcart"
    data-api-key="{% if jekyll.environment == "prod" %}{{ site.snipcart_api_key.live }}{% else %}{{ site.snipcart_api_key.test }}{% endif %}">
</div>

<script>
    document.addEventListener('snipcart.ready', function () {
        Snipcart.store.subscribe(() => {
            Snipcart.store.getState().cart.items.count == 0 ? $('.snipcart-checkout').addClass('d-none') : $('.snipcart-checkout').removeClass('d-none')
        });

        Snipcart.execute('bind', 'cart.opened', function () {
            Snipcart.execute('unbind', 'cart.opened');
            $('#snipcart-footer').append(
                '<a id="license-terms" href="{{ site.url }}/license" target="_blank" class="text-capitalize text-white font-italic float-right snipcart-license-terms py-2">View license terms</a>'
            );
        });
    });
</script>
