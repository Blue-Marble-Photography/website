title: 'Blue Marble Photography'
description: "Our Blue Marble, the planet Earth, has so many amazing, jaw-dropping, wonderous views all around us that I am delighted to share with you through my photography. In the infamous words of Apollo 8 astronaut Bill Anders, 'Oh, my God! Look at that picture over there! Here's the earth coming up. Wow, is that pretty!'"
headline: "That's here, that's home, that's us."

url: 'https://bluemarble.photography'
base_url: '/'
asset_url: '/assets'
image_url: '/assets/images'
photo_url: 'https://images.bluemarble.photography'
featured_image_url: 'https://images.bluemarble.photography'

google_analytics: 'UA-60495309-1'
onesignal_api_key: 'e0cbc398-0a93-49be-bdd7-8dbc8e2151c5'
