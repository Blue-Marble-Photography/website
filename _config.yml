social:
  links:
    - https://twitter.com/BlueMarblePhoto
    - https://www.facebook.com/BlueMarblePhoto
    - https://www.instagram.com/josephgruber

destination: _site
paginate: 10
paginate_path: '/blog/page:num/'
permalink: /post/:title/
markdown: kramdown
highlighter: rouge
future: false

kramdown:
  input: GFM

defaults:
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
  - scope:
      path: '_galleries/geb'
    values:
      sitemap: false
  - scope:
      path: '_galleries/private'
    values:
      sitemap: false

collections:
  galleries:
    output: true
    permalink: gallery/:path/

plugins: ['jekyll-paginate', 'jekyll-last-modified-at', 'jekyll-sitemap']

exclude:
  [
    'vendor',
    'Gemfile',
    'Gemfile.lock',
    'gulpfile.js',
    'node_modules',
    'package.json',
    'package-lock.json',
    'write-gallery-meta.php',
    'rev-manifest.json',
    's3_website.yml',
  ]

compress_html:
  clippings: all
